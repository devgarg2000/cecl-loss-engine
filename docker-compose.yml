services:
  # ---- Object storage (S3-compatible lake) ----
  minio:
    image: quay.io/minio/minio:latest
    container_name: cecl-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-time job: create bronze/silver/gold buckets on first startup
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
      mc mb -p local/cecl-lake/bronze local/cecl-lake/silver local/cecl-lake/gold;
      exit 0;
      "

  # ---- Airflow metadata DB ----
  postgres:
    image: postgres:15
    container_name: cecl-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # ---- Airflow (LocalExecutor: simple, no Redis/Celery needed) ----
  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: >
      /bin/bash -c "airflow db migrate &&
      airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Dev --lastname Garg --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: cecl-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: cecl-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment:
      <<: *airflow-common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # JSON form (not a plain URI): a plain "spark://host:port" URI loses the scheme when Airflow
      # parses it (ends up calling spark-submit with "--master host:port", which spark-submit rejects).
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./jars:/opt/extra-jars:ro   # Iceberg + S3A connector jars (pip's pyspark doesn't bundle these; bitnami's spark image does)
    command: scheduler

  # ---- Spark cluster (real distributed compute, not local mode) ----
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: cecl-spark-master
    environment:
      - SPARK_MODE=master
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "7077:7077"   # Spark master port
      - "8081:8080"   # Spark master UI (8080 is taken by Airflow)
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data/raw:/opt/spark-data/raw:ro
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:/opt/bitnami/spark/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:ro

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: cecl-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=6G   # was 4G; left no real room once Thrift's 1G was subtracted (OOM-killed a job, confirmed exit 137)
      - SPARK_WORKER_CORES=6
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data/raw:/opt/spark-data/raw:ro
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:/opt/bitnami/spark/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:ro

  # ---- Spark Thrift server: a JDBC endpoint so DBeaver (or any SQL tool) can query the lake ----
  spark-thrift:
    image: bitnamilegacy/spark:3.5
    container_name: cecl-spark-thrift
    user: root
    depends_on:
      - spark-master
      - spark-worker
      - minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "10000:10000"   # JDBC (HiveServer2 protocol)
    working_dir: /opt/thrift
    volumes:
      - thrift_meta:/opt/thrift    # saved views/databases survive container recreation
      - ./jobs:/opt/spark-jobs
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:/opt/bitnami/spark/jars/iceberg-spark-runtime-3.5_2.12-1.6.1.jar:ro
    command: ["bash", "/opt/spark-jobs/spark_thrift.sh"]

volumes:
  thrift_meta:
  minio_data:
  postgres_data:
