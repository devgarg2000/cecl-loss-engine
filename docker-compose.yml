services:
  # ---- Object storage (S3-compatible lake) ----
  minio:
    image: quay.io/minio/minio:latest
    container_name: cecl-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-time job: create bronze/silver/gold buckets on first startup
  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD;
      mc mb -p local/cecl-lake/bronze local/cecl-lake/silver local/cecl-lake/gold;
      exit 0;
      "

  # ---- Airflow metadata DB ----
  postgres:
    image: postgres:15
    container_name: cecl-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  # ---- Airflow (LocalExecutor: simple, no Redis/Celery needed) ----
  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: >
      /bin/bash -c "airflow db migrate &&
      airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Dev --lastname Garg --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: cecl-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: cecl-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
    command: scheduler

  # ---- Spark cluster (real distributed compute, not local mode) ----
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: cecl-spark-master
    environment:
      - SPARK_MODE=master
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "7077:7077"   # Spark master port
      - "8081:8080"   # Spark master UI (8080 is taken by Airflow)
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data/raw:/opt/spark-data/raw:ro

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: cecl-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data/raw:/opt/spark-data/raw:ro

volumes:
  minio_data:
  postgres_data:
